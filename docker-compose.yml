services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: musicdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  flask1:
    build: ./server
    environment:
      FLASK_ENV: development
      SERVER_ID: flask1
      DATABASE_URL: postgresql+psycopg2://music:music@postgres:5432/musicdb
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  flask2:
    build: ./server
    environment:
      FLASK_ENV: development
      SERVER_ID: flask2
      DATABASE_URL: postgresql+psycopg2://music:music@postgres:5432/musicdb
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - flask1
      - flask2

  client:
    build: ./client
    ports:
      - "5173:5173"

volumes:
  pgdata:
