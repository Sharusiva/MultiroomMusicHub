# Multiroom Music Hub: 3 Flask nodes behind NGINX, sharing PostgreSQL + Redis.
#
#   ./start.sh            (recommended: detects your Wi-Fi IP for the QR code)
#   docker compose up --build
#
# Then open http://localhost on this computer, or http://<your-ip> on any
# phone/laptop on the same Wi-Fi.

x-flask: &flask
  build: ./server
  restart: unless-stopped
  environment: &flask-env
    DATABASE_URL: postgresql+psycopg2://music:music@postgres:5432/musicdb
    REDIS_URL: redis://redis:6379
    MEDIA_DIR: /media
    PUBLIC_HOST: ${PUBLIC_HOST:-}
    START_LEAD_MS: ${START_LEAD_MS:-600}
  volumes:
    - ./media:/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: musicdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d musicdb"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine

  flask1:
    <<: *flask
    environment:
      <<: *flask-env
      SERVER_ID: flask1

  flask2:
    <<: *flask
    environment:
      <<: *flask-env
      SERVER_ID: flask2

  flask3:
    <<: *flask
    environment:
      <<: *flask-env
      SERVER_ID: flask3

  # Builds the React app and serves it, the audio files, and the load-balanced
  # API/WebSocket traffic, all on one port reachable from the whole network.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./media:/usr/share/nginx/media:ro
    depends_on:
      - flask1
      - flask2
      - flask3

  # Optional: docker compose --profile loadtest run --rm loadtest --clients 300
  loadtest:
    build: ./loadtest
    profiles: ["loadtest"]
    command: ["--url", "http://nginx", "--clients", "200"]
    volumes:
      - ./loadtest:/out
    working_dir: /out
    depends_on:
      - nginx

volumes:
  pgdata:
