# Docker's internal DNS: re-resolve backend names so a node that is stopped and
# restarted (possibly with a new IP) rejoins the pool without restarting NGINX.
resolver 127.0.0.11 valid=5s ipv6=off;

# REST calls are short and stateless -> plain round-robin across all nodes.
upstream flask_rest {
    zone flask_rest 64k;
    server flask1:5000 resolve max_fails=1 fail_timeout=3s;
    server flask2:5000 resolve max_fails=1 fail_timeout=3s;
    server flask3:5000 resolve max_fails=1 fail_timeout=3s;
}

# WebSockets are long-lived -> send each new connection to the node with the
# FEWEST open connections. Clients use WebSocket-only transport, so no sticky
# sessions (ip_hash) are needed and many devices behind one IP still spread out.
#
# max_fails=0: NGINX only marks a failed server healthy again after a request
# through it *completes*, and a WebSocket can stay open for hours. With failure
# counting on, a restarted node would keep receiving almost no connections. A
# refused connect still falls through to the next node instantly
# (proxy_next_upstream), so nothing is lost by turning it off.
upstream flask_ws {
    zone flask_ws 64k;
    least_conn;
    server flask1:5000 resolve max_fails=0;
    server flask2:5000 resolve max_fails=0;
    server flask3:5000 resolve max_fails=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 50m;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass            http://flask_rest;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_next_upstream   error timeout http_502 http_503;
        add_header            X-Upstream $upstream_addr always;
    }

    location /socket.io/ {
        proxy_pass            http://flask_ws;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_set_header      Host $host;
        proxy_connect_timeout 2s;
        proxy_next_upstream   error timeout;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # Audio files are served straight from the shared volume by NGINX (with HTTP
    # range requests for seeking), so streaming never loads the Flask nodes.
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=3600";
    }

    # Built JS/CSS files have a content hash in their name, so they can be cached
    # forever. index.html must never be cached, or a browser keeps loading the old
    # app after a rebuild.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
